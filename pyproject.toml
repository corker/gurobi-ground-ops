[project]
name = "ground-ops"
version = "0.1.0"
description = "Learning Gurobi on airport ground-operations problems: assignment and shift-coverage models, with solver telemetry."
readme = "README.md"
authors = [
    { name = "Michael Borisov" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "gurobipy~=14.0",
]

[build-system]
requires = ["uv_build>=0.10.5,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "ANN", "C90", "PT", "ARG", "RET", "ERA", "T20", "PLR"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
strict = true
files = ["src", "tests"]
