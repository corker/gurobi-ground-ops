[project]
name = "ground-ops"
version = "0.1.0"
description = "Learning Gurobi on airport ground-operations problems: assignment and shift-coverage models, with solver telemetry."
readme = "README.md"
authors = [
    { name = "Michael Borisov" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "gurobipy~=14.0",
    "opentelemetry-api~=1.45",
    "opentelemetry-exporter-otlp-proto-http~=1.45",
    "opentelemetry-sdk~=1.45",
]

[project.scripts]
ground-ops = "ground_ops.cli:main"

[build-system]
requires = ["uv_build>=0.10.5,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "testcontainers>=4.15.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "ANN", "C90", "PT", "ARG", "RET", "ERA", "T20", "PLR", "C4", "FURB", "PERF", "PIE", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
"src/ground_ops/cli.py" = ["T20"]
"experiments/**" = ["T20"]

[tool.mypy]
strict = true
files = ["src", "tests", "experiments"]

[tool.pytest.ini_options]
addopts = "--cov=ground_ops --cov-branch --cov-report=term-missing -m 'not integration'"
markers = ["integration: needs Docker; starts a grafana/otel-lgtm container (run with -m integration)"]
